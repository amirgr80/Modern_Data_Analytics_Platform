x-pipeline-env: &pipeline-env
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  KAFKA_BOOTSTRAP_SERVERS: "185.255.90.14:9092"
  ICEBERG_REST_URI: "http://iceberg-rest:8181"
  ICEBERG_WAREHOUSE: "s3://warehouse"
  SPARK_MASTER_URL: "spark://spark-master:7077"

x-airflow-common: &airflow-common
  image: docker.arvancloud.ir/apache/airflow:3.2.1-python3.12
  environment: &airflow-common-env
    TZ: Asia/Tehran
    _PIP_ADDITIONAL_REQUIREMENTS: >-
      apache-airflow-providers-celery
      apache-airflow-providers-postgres
      apache-airflow-providers-amazon
      apache-airflow-providers-apache-spark
      apache-airflow-providers-common-sql
      confluent-kafka
      clickhouse-connect
      pandas
      pyarrow
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth/simple_auth_manager_passwords.json.generated
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__BASE_URL: "https://airflow.group1.querabootcamp-de.ir"
    MINIO_ENDPOINT: "http://minio:9000"
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ICEBERG_REST_URI: "http://iceberg-rest:8181"
    ICEBERG_WAREHOUSE: "s3://warehouse"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_HTTP_PORT: "8123"
    CLICKHOUSE_DB: lakehouse
    CLICKHOUSE_USER: ${CLICKHOUSE_USER}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    KAFKA_BOOTSTRAP_SERVERS: "185.255.90.14:9092"
    SPARK_MASTER_URL: "spark://spark-master:7077"

  user: "50000:0"
  volumes:
    - ./workflow/dags:/opt/airflow/dags
    - ./workflow/tasks:/opt/airflow/tasks
    - ./workflow/utils:/opt/airflow/utils
    - ./workflow/plugins:/opt/airflow/plugins
    - airflow_logs:/opt/airflow/logs
    - ./src:/opt/airflow/src
    - ./configs/airflow:/opt/airflow/config
    - airflow_auth:/opt/airflow/simple_auth
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - datalake
  restart: unless-stopped

x-traefik: &traefik-net
  - traefik

x-traefik-labels-airflow: &traefik-labels-airflow
  traefik.enable: "true"
  traefik.docker.network: traefik_traefik_network
  traefik.http.routers.airflow.rule: Host(`airflow.group1.querabootcamp-de.ir`)
  traefik.http.routers.airflow.entrypoints: web
  traefik.http.services.airflow.loadbalancer.server.port: "8080"

x-traefik-labels-minio: &traefik-labels-minio
  traefik.enable: "true"
  traefik.docker.network: traefik_traefik_network
  traefik.http.routers.minio.rule: Host(`storage.group1.querabootcamp-de.ir`)
  traefik.http.routers.minio.entrypoints: web
  traefik.http.services.minio.loadbalancer.server.port: "9001"

x-traefik-labels-metabase: &traefik-labels-metabase
  traefik.enable: "true"
  traefik.docker.network: traefik_traefik_network
  traefik.http.routers.metabase.rule: Host(`mb.group1.querabootcamp-de.ir`)
  traefik.http.routers.metabase.entrypoints: web
  traefik.http.services.metabase.loadbalancer.server.port: "3000"

services:
  postgres:
    image: docker.arvancloud.ir/postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - datalake

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - datalake

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    environment:
      <<: *airflow-common-env
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/simple_auth
        echo "{\"${AIRFLOW_ADMIN_USER}\": \"${AIRFLOW_ADMIN_PASSWORD}\"}" > /opt/airflow/simple_auth/simple_auth_manager_passwords.json.generated
        chown -R "50000:0" /opt/airflow/simple_auth
        /entrypoint airflow db migrate
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    labels:
      <<: *traefik-labels-airflow
    networks:
      - datalake
      - traefik
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname $$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  spark-master:
    image: docker.arvancloud.ir/apache/spark:3.5.3
    container_name: spark-master
    user: root
    entrypoint:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      <<: *pipeline-env
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark-apps
      - ./configs/spark:/opt/spark/conf
      - spark_data:/opt/spark/work
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - datalake

  spark-worker:
    image: docker.arvancloud.ir/apache/spark:3.5.3
    container_name: spark-worker
    user: root
    entrypoint:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]
    environment:
      <<: *pipeline-env
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2G
    ports:
      - "8082:8081"
    volumes:
      - ./src:/opt/spark-apps
      - ./configs/spark:/opt/spark/conf
      - spark_data:/opt/spark/work
    depends_on:
      spark-master:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - datalake

  minio:
    image: docker.arvancloud.ir/minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ROOT_USER_FILE: ""
      MINIO_ROOT_PASSWORD_FILE: ""
      MINIO_BROWSER_REDIRECT_URL: https://storage.group1.querabootcamp-de.ir
    labels:
      <<: *traefik-labels-minio
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - datalake
      - traefik

  iceberg-catalog-db:
    image: docker.arvancloud.ir/postgres:16-alpine
    container_name: iceberg-catalog-db
    environment:
      POSTGRES_USER: ${ICEBERG_CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD}
      POSTGRES_DB: iceberg_catalog
    volumes:
      - iceberg_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ICEBERG_CATALOG_DB_USER} -d iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - datalake

  iceberg-rest:
    image: docker.arvancloud.ir/tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    environment:
      CATALOG_WAREHOUSE: "s3://warehouse"
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_URI: jdbc:postgresql://iceberg-catalog-db:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${ICEBERG_CATALOG_DB_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD}
    ports:
      - "8181:8181"
    depends_on:
      minio:
        condition: service_healthy
      iceberg-catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8181"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - datalake

  clickhouse:
    image: docker.arvancloud.ir/clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: lakehouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: Asia/Tehran
    ports:
      - "8123:8123"
      - "9004:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - datalake

  postgres-metabase:
    image: docker.arvancloud.ir/postgres:16-alpine
    container_name: postgres-metabase
    environment:
      POSTGRES_USER: ${METABASE_DB_USER}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
      POSTGRES_DB: metabase
    volumes:
      - postgres_metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_DB_USER} -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - datalake

  metabase:
    image: docker.arvancloud.ir/metabase/metabase:v0.51.4
    container_name: metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      MB_DB_HOST: postgres-metabase
      MB_SITE_URL: https://mb.group1.querabootcamp-de.ir
    labels:
      <<: *traefik-labels-metabase
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres-metabase:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:3000/api/health > /dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - datalake
      - traefik

networks:
  datalake:
    driver: bridge
  traefik:
    external: true
    name: traefik_traefik_network

volumes:
  postgres_data:
  postgres_metabase_data:
  minio_data:
  clickhouse_data:
  metabase_data:
  spark_data:
  airflow_logs:
  airflow_auth:
  iceberg_catalog_data:
